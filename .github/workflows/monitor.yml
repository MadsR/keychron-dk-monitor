name: Keychron monitor

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LAST_STATE_FILE: last_state.json
        run: |
          python monitor.py

      - name: Ensure last_state.json exists for artifact upload
        run: |
          if [ ! -f last_state.json ]; then
            echo '{"found": false, "consecutive": 0, "evidence": [], "updated_at": null}' > last_state.json
          fi

      - name: Upload last_state.json
        uses: actions/upload-artifact@v4
        with:
          name: last_state
          path: last_state.json
