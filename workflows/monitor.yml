name: Keychron monitor

on:

  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:


jobs:

  check:

    runs-on: ubuntu-latest


    steps:

    - uses: actions/checkout@v4


    - uses: actions/setup-python@v5

      with:
        python-version: "3.12"


    - run: pip install -r requirements.txt


    - run: python monitor.py

      env:

        EMAIL_FROM:
          ${{ secrets.EMAIL_FROM }}

        EMAIL_PASSWORD:
          ${{ secrets.EMAIL_PASSWORD }}

        EMAIL_TO:
          ${{ secrets.EMAIL_TO }}
